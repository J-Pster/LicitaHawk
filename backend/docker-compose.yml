services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: licitahawk-dynamodb-local
    # user root: o volume nomeado do Docker nasce com dono root e o processo (uid 1000 por padrao
    # na imagem) nao consegue escrever nele -- sem isso o sqlite falha com "unable to open database file".
    user: "root"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    working_dir: /home/dynamodblocal
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: licitahawk-dynamodb-admin
    environment:
      DYNAMO_ENDPOINT: "http://dynamodb-local:8000"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "local"
      AWS_SECRET_ACCESS_KEY: "local"
    ports:
      - "8001:8001"
    depends_on:
      - dynamodb-local

volumes:
  dynamodb-data:
